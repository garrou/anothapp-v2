<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anothapp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Static, JS-free boot state: shown while main.ts waits for the initial route
         (including its async auth guard) to resolve, before Vue ever mounts. Vue's
         mount replaces #app's content wholesale, so this whole subtree - wrapper
         included - is removed automatically once it does. The centering lives on
         .boot-spinner-wrap, never on #app itself, so it can't outlive the spinner and
         affect the real app's layout after mount. */
      body {
        margin: 0;
        background: #F6F6FA;
      }
      .boot-spinner-wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(108, 92, 224, 0.18);
        border-top-color: #6C5CE0;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #131022; }
        .boot-spinner { border-color: rgba(156, 140, 255, 0.18); border-top-color: #9C8CFF; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-spinner-wrap"><div class="boot-spinner" role="status" aria-label="Chargement"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
